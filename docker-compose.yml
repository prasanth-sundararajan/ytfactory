name: ytfactory

services:
  postgres:
    image: postgres:16-alpine
    container_name: ytf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ytfactory
      TZ: Asia/Kolkata
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytf -d ytfactory"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ytf-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:56379:6379"
    mem_limit: 384m
    cpus: 0.5

  worker:
    build: ./worker
    container_name: ytf-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ytf:${POSTGRES_PASSWORD}@postgres:5432/ytfactory
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Kolkata
      STATE_PATH: /app/data/state.json
      CONFIG_PATH: /app/config/agents.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./worker:/app
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./work:/app/work
      - ./logs:/app/logs
    mem_limit: 2g
    cpus: 1.5
